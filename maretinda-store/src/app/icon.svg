<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#F2ECF8"/>
  <!-- 4-petal Maretinda flower: petals at NW, NE, SE, SW (diagonal) -->
  <!-- Base petal points north, then rotated 45°, 135°, 225°, 315° around center (16,16) -->
  <path d="M16,17 C12.5,14 11,7.5 16,5 C21,7.5 19.5,14 16,17Z" fill="#432C63" transform="rotate(45,16,16)"/>
  <path d="M16,17 C12.5,14 11,7.5 16,5 C21,7.5 19.5,14 16,17Z" fill="#432C63" transform="rotate(135,16,16)"/>
  <path d="M16,17 C12.5,14 11,7.5 16,5 C21,7.5 19.5,14 16,17Z" fill="#432C63" transform="rotate(225,16,16)"/>
  <path d="M16,17 C12.5,14 11,7.5 16,5 C21,7.5 19.5,14 16,17Z" fill="#432C63" transform="rotate(315,16,16)"/>
</svg>
