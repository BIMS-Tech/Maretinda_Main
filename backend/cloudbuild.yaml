steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/maretinda-test/cloud-run-source-deploy/maretinda-backend:latest'
      - '.'

  # 2. Push the image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/maretinda-test/cloud-run-source-deploy/maretinda-backend:latest'

  # 3. Run database migrations as a Cloud Run Job BEFORE deploying the new revision.
  #    If this step fails the deploy step is skipped, keeping the running service intact.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        # Delete old migrate job if it exists, ignore errors
        gcloud run jobs delete maretinda-migrate --region=us-central1 --quiet 2>/dev/null || true

        gcloud run jobs create maretinda-migrate \
          --image=us-central1-docker.pkg.dev/maretinda-test/cloud-run-source-deploy/maretinda-backend:latest \
          --command=node_modules/.bin/medusa \
          --args=db:migrate \
          --region=us-central1 \
          --set-secrets=DATABASE_URL=DATABASE_URL:latest \
          --set-env-vars=NODE_ENV=production,DB_HOST=/cloudsql/maretinda-test:us-central1:maretinda-db-test-2,MEDUSA_DISABLE_TELEMETRY=1 \
          --set-cloudsql-instances=maretinda-test:us-central1:maretinda-db-test-2 \
          --max-retries=0 \
          --task-timeout=5m \
          --execute-now \
          --wait \
          --quiet

  # 4. Deploy the new revision (only reached if migrations succeeded)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'maretinda-backend'
      - '--image=us-central1-docker.pkg.dev/maretinda-test/cloud-run-source-deploy/maretinda-backend:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--quiet'

images:
  - 'us-central1-docker.pkg.dev/maretinda-test/cloud-run-source-deploy/maretinda-backend:latest'

timeout: '7200s'
