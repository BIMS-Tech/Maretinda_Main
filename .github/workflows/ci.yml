name: CI

# Checks every pull request and every push to main or production before a
# deploy can carry a broken build: the backend type-checks and its unit tests
# pass. It does not gate the deploy workflows; a red run here is the signal.
on:
  pull_request:
  push:
    branches: [main, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - name: Type-check
        run: yarn tsc --noEmit -p tsconfig.json
      - name: Unit tests
        run: yarn test:unit
