name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

env:
  GCP_PROJECT_ID: maretinda-test
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
  IMAGE_REPO: us-central1-docker.pkg.dev/maretinda-test/cloud-run-source-deploy/maretinda-backend
  CLOUD_RUN_SERVICE: maretinda-backend

jobs:
  build-and-deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_REPO }}:${{ github.sha }} \
            -t ${{ env.IMAGE_REPO }}:latest \
            ./backend

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_REPO }}:${{ github.sha }}
          docker push ${{ env.IMAGE_REPO }}:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          image: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}
